name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  # Changelog gate. Diffs the PR branch against its real base branch and fails
  # if any touched project is missing its per-PR changelog entry. Pure stdlib,
  # so no `uv sync`; just enough git history to compute the diff.
  #
  # Opt-in: this job only runs when the repository variable ENFORCE_CHANGELOG is
  # set to 'true' (Settings -> Secrets and variables -> Actions -> Variables).
  # Downstream repos that publish a workspace inherit this workflow but not the
  # variable, so they never see a changelog CI failure. The template repo sets
  # ENFORCE_CHANGELOG=true to enforce the convention on itself.
  check-changelog:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.ENFORCE_CHANGELOG == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Fetch base branch and deepen HEAD for the changelog diff
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --unshallow origin "$(git rev-parse HEAD)"
          fi
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check changelog entries
        run: python system/scripts/check_changelog_entries.py

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: system/apps/system_interface/frontend/package-lock.json

      - name: Install Python dependencies
        run: uv sync --all-packages

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      # KasmVNC provides Xvnc, the X server every browser in the fleet renders into.
      # The fleet is headful-only -- there is no headless mode to fall back to -- so
      # the real-Chromium integration tests cannot launch a browser without this.
      #
      # The runner is Ubuntu, so this is the `noble` build; the workspace image is
      # Debian trixie and pins its own copy in system/scripts/env.d/1010-kasmvnc.sh.
      # Same upstream version (1.4.0) on both, so keep the two pins in step.
      - name: Install KasmVNC (Xvnc)
        run: |
          set -euo pipefail
          url="https://github.com/kasmtech/KasmVNC/releases/download/v1.4.0/kasmvncserver_noble_1.4.0_amd64.deb"
          sha256="12bac6014149c5fdee75f0d403785aaa3e5dd4ea222de73253a5d4181bc9567e"
          curl -fsSL -o /tmp/kasmvncserver.deb "$url"
          echo "$sha256  /tmp/kasmvncserver.deb" | sha256sum --check --strict
          # `apt-get install ./file.deb` (not `dpkg -i`) so the dependency tail --
          # xkbcomp, xkb-data, xauth, libxfont2 -- resolves. Xvnc exits immediately
          # at startup without xkbcomp, and a slim runner has no X fonts either.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends /tmp/kasmvncserver.deb xfonts-base
          Xvnc -version

      - name: Build system/apps/system_interface frontend
        working-directory: system/apps/system_interface/frontend
        run: |
          npm ci
          npm run build

      - name: Run root tests
        run: PYTEST_MAX_DURATION_SECONDS=300 uv run pytest

      - name: Run system/apps/system_interface tests
        working-directory: system/apps/system_interface
        run: PYTEST_MAX_DURATION_SECONDS=300 uv run pytest
